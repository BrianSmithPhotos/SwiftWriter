name: SwiftWriter

options:
  bundleIdPrefix: photos.briansmith
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SwiftWriterCore:
    path: Packages/SwiftWriterCore

targets:
  SwiftWriter:
    type: application
    # One target for both platforms. The Document API and the editor are shared; the few
    # places that differ are guarded with #if os(...).
    # "macOS" is the spelling xcodegen understands - "mac" is silently dropped, which
    # leaves SUPPORTED_PLATFORMS iOS-only and makes a "platform=macOS" build a false pass.
    supportedDestinations: [macOS, iOS]
    deploymentTarget:
      macOS: "27.0"
      iOS: "27.0"
    sources:
      - path: App
    dependencies:
      - package: SwiftWriterCore
        product: PostKit
      - package: SwiftWriterCore
        product: ImageKit
      - package: SwiftWriterCore
        product: AltTextKit
      - package: SwiftWriterCore
        product: BlogPublishing
      - package: SwiftWriterCore
        product: WordPressProvider
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SwiftWriter
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        # Two posts side by side on the iPad. Removed briefly while bisecting the
        # iPad document-icon problem; it was not the cause, so it is back.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Without a launch screen iOS can run the app letterboxed.
        UILaunchScreen: {}
        # Xcode puts this in every generated iOS Info.plist. This target writes its
        # plist by hand (GENERATE_INFOPLIST_FILE: false), so nothing added it and it
        # was simply missing. Xcode strips it from the macOS bundle by itself.
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # Both are needed for the Files-based document browser on iPad. Without
        # LSSupportsOpeningDocumentsInPlace the system hands the app a copy in the
        # Inbox instead of the original, so an edit saves somewhere other than the
        # file that was opened.
        # INFOPLIST_KEY_* build settings are ignored when GENERATE_INFOPLIST_FILE is
        # false, so orientations are declared here rather than in settings.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        # Declaring the type is what makes the Finder and the iOS document browser
        # recognise a .swiftpost bundle as one file rather than a folder.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: photos.briansmith.swiftwriter.post
            UTTypeDescription: SwiftWriter Post
            # com.apple.package marks the directory as a bundle, so the Finder and
            # Files show one file rather than a folder. public.composite-content
            # says it is a document made of parts; com.apple.rtfd declares the same
            # pair. Note the cost: on iPadOS 27 a package type never draws its
            # UTTypeIconBackgroundName on a physical device, .rtfd included, so the
            # iPad shows a plain page. The Finder and the Simulator both draw it.
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [swiftpost]
            # Without this macOS composes a document icon itself: a blank page with
            # the app tile shrunk onto it, which at the 16pt a Finder list draws
            # leaves nothing to recognise. The system still draws the page, the
            # turned corner and the extension; this only names the image that fills
            # it. An .icns under UTTypeIconFile is the older way and macOS 27
            # ignores it. Generated by Tools/IconGen.
            UTTypeIcons:
              UTTypeIconBackgroundName: DocumentFill
        CFBundleDocumentTypes:
          - CFBundleTypeName: SwiftWriter Post
            LSItemContentTypes: [photos.briansmith.swiftwriter.post]
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
    # Signing lives in a gitignored Local.xcconfig so the Team ID stays off GitHub.
    # Copy Local.xcconfig.example to Local.xcconfig to build.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        # Lower case, so the bundle id is exactly the prefix of the exported UTIs
        # above (photos.briansmith.swiftwriter.post). An app is authoritative for a
        # type only inside its own bundle-identifier namespace, and "SwiftWriter"
        # is not a prefix of "swiftwriter".
        PRODUCT_BUNDLE_IDENTIFIER: photos.briansmith.swiftwriter
        # iPad, not iPhone. A block editor with an inspector needs the width, and
        # the plan never targeted the phone. Left unset the target builds universal,
        # which puts UIDeviceFamily [1, 2] in the bundle and compiles every icon set
        # for the phone idiom as well as the pad.
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        # Both sets in App/Assets.xcassets are generated by Tools/IconGen, so the
        # artwork is a few numbers rather than a PNG nobody can adjust.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # DocumentFill is an icon set too, and actool drops every icon set that is
        # not the app icon unless it is named here. On macOS that adds no
        # alternate-icon keys to Info.plist; on iOS it adds a CFBundleAlternateIcons
        # entry for it, which is inert because nothing calls setAlternateIconName.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: [DocumentFill]
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
